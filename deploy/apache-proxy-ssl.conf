# cPanel userdata include for the ads subdomain's SSL (:443) vhost.
# ROBUST ROUTE (survives httpd.conf rebuilds). Needs WHM/root.
#
# Install (replace <CPUSER> with the cPanel account that owns the subdomain):
#   mkdir -p /etc/apache2/conf.d/userdata/ssl/2_4/<CPUSER>/ads.bluekarmasecrets.com
#   cp apache-proxy-ssl.conf \
#     /etc/apache2/conf.d/userdata/ssl/2_4/<CPUSER>/ads.bluekarmasecrets.com/proxy.conf
#   /usr/local/cpanel/scripts/ensure_vhost_includes --user=<CPUSER>
#   /usr/local/cpanel/scripts/rebuildhttpdconf && systemctl restart httpd

ProxyPreserveHost On
ProxyRequests Off

# AutoSSL ACME challenge must be served from the docroot, not proxied.
ProxyPass /.well-known/ !

ProxyPass / http://127.0.0.1:3000/ retry=1 acquire=3000 timeout=600 keepalive=On
ProxyPassReverse / http://127.0.0.1:3000/

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"
