# cPanel userdata include for the ads subdomain's standard (:80) vhost.
# Redirects HTTP → HTTPS (paired with apache-proxy-ssl.conf). Needs WHM/root.
#
# Install (replace <CPUSER>):
#   mkdir -p /etc/apache2/conf.d/userdata/std/2_4/<CPUSER>/ads.bluekarmasecrets.com
#   cp apache-proxy-std.conf \
#     /etc/apache2/conf.d/userdata/std/2_4/<CPUSER>/ads.bluekarmasecrets.com/redirect.conf
#   /usr/local/cpanel/scripts/ensure_vhost_includes --user=<CPUSER>
#   /usr/local/cpanel/scripts/rebuildhttpdconf && systemctl restart httpd

RewriteEngine On
# Let AutoSSL validate over HTTP; redirect everything else to HTTPS.
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
